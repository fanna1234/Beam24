<rect x="396" y="121.362" width="25" height="10.638" fill="#d9dfe4"/>
<text x="408.5" y="152" font-size="14" font-weight="400" text-anchor="middle">3</text>
<path d="M286 132 L431 132" stroke="#6b7279" stroke-width="1" fill="none"/>
<path d="M444 110 L482 110" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="620" y="62" font-size="20" font-weight="600" text-anchor="middle">Joint-complex 2:4</text>
