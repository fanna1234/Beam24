<g font-family="Arial, Helvetica, sans-serif" fill="#111111">
<text x="20" y="27" font-size="14" font-weight="600" text-anchor="start">LOCAL STRUCTURE</text>
<text x="117" y="62" font-size="20" font-weight="600" text-anchor="middle">Array phase</text>
<path d="M25 115 L205 115" stroke="#aab1b8" stroke-width="1.6" fill="none"/>
<circle cx="47" cy="112" r="16" fill="white" stroke="#7f9cb2" stroke-width="1.5"/>
<path d="M47 112 L70.0 112.0" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<circle cx="94" cy="112" r="16" fill="white" stroke="#7f9cb2" stroke-width="1.5"/>
<path d="M94 112 L110.2634559672906 95.7365440327094" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
