<path d="M141 112 L141.0 89.0" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<circle cx="188" cy="112" r="16" fill="white" stroke="#7f9cb2" stroke-width="1.5"/>
<path d="M188 112 L171.73654403270942 95.7365440327094" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="117" y="157" font-size="15" font-weight="400" text-anchor="middle">Four adjacent sensors</text>
<path d="M226 110 L268 110" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="352" y="62" font-size="20" font-weight="600" text-anchor="middle">Local F4 modes</text>
<rect x="291" y="70.000" width="25" height="62.000" fill="#88aac4"/>
