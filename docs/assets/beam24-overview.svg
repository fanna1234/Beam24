<path d="M269 275 L306 275" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M578 275 L616 275" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M879 275 L916 275" stroke="#202124" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="20" y="346" font-size="15" font-weight="400" text-anchor="start">Both search stages use the sparse representation; no full complex response matrix is written.</text>
</g>
</svg>
