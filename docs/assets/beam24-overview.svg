<text x="137.5" y="270" font-size="21" font-weight="600" text-anchor="middle">Coarse search</text>
<text x="137.5" y="297" font-size="17" font-weight="400" text-anchor="middle">K128 · 128 beams</text>
<rect x="320" y="239" width="245" height="74" rx="6" fill="#f2f5f7"/>
<text x="442.5" y="270" font-size="21" font-weight="600" text-anchor="middle">Select + gather</text>
