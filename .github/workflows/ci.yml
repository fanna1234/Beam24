name: beam24-ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y shellcheck ninja-build
      - run: make ci
      - run: cmake --preset cpu-check
      - run: python3 scripts/check_reference_anchors.py
